<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfaf1"/>
      <stop offset="100%" stop-color="#f0e6d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Paper background with subtle gradient -->
  <rect width="1200" height="630" fill="url(#paper)"/>

  <!-- Subtle ruled lines for postal texture -->
  <g opacity="0.04" stroke="#11141c" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Postcard illustration center-left, tilted -->
  <g transform="translate(120 165) rotate(-3)" filter="url(#shadow)">
    <rect width="380" height="240" rx="8" fill="#fff" stroke="#d4c9b1" stroke-width="1"/>
    <!-- Stamp -->
    <rect x="320" y="14" width="44" height="54" fill="#b8483a" stroke="#fdfaf1" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="342" y="46" text-anchor="middle" fill="#fdfaf1" font-family="Georgia, serif" font-size="11" font-weight="700">$0.55</text>
    <!-- Address lines -->
    <line x1="32" y1="100" x2="240" y2="100" stroke="#11141c" stroke-width="1" opacity="0.55"/>
    <line x1="32" y1="130" x2="280" y2="130" stroke="#11141c" stroke-width="1" opacity="0.45"/>
    <line x1="32" y1="160" x2="220" y2="160" stroke="#11141c" stroke-width="1" opacity="0.35"/>
    <line x1="32" y1="190" x2="200" y2="190" stroke="#11141c" stroke-width="1" opacity="0.25"/>
    <!-- Postmark circle -->
    <circle cx="220" cy="50" r="36" fill="none" stroke="#3c6e8f" stroke-width="2" opacity="0.4"/>
    <circle cx="220" cy="50" r="30" fill="none" stroke="#3c6e8f" stroke-width="1" opacity="0.35"/>
    <text x="220" y="44" text-anchor="middle" fill="#3c6e8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="0.8" opacity="0.7">MAILROOM</text>
    <text x="220" y="60" text-anchor="middle" fill="#3c6e8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="0.8" opacity="0.7">DELIVERED</text>
  </g>

  <!-- Right-side text block -->
  <g transform="translate(580 175)">
    <!-- Kicker -->
    <text x="0" y="0" fill="#b8483a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">YOUR POSTCARD</text>

    <!-- Big headline -->
    <text x="0" y="65" fill="#11141c" font-family="Georgia, ui-serif, serif" font-size="64" font-weight="600">It's in the mail.</text>

    <!-- Subhead -->
    <text x="0" y="125" fill="#11141c" font-family="Georgia, ui-serif, serif" font-style="italic" font-size="22" opacity="0.7">Real paper postcards by text.</text>
    <text x="0" y="155" fill="#11141c" font-family="Georgia, ui-serif, serif" font-style="italic" font-size="22" opacity="0.7">Watch yours travel.</text>

    <!-- Route -->
    <g transform="translate(0 210)">
      <circle cx="6" cy="6" r="6" fill="#3c6e8f"/>
      <line x1="14" y1="6" x2="100" y2="6" stroke="#b8483a" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="108" cy="6" r="6" fill="#b8483a"/>
      <text x="124" y="11" fill="#11141c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" opacity="0.7">First class · 3-5 days</text>
    </g>

    <!-- Site URL -->
    <text x="0" y="280" fill="#11141c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" opacity="0.5">app.themailroom.club</text>
  </g>
</svg>
