<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Your postcard is in the mail — Mailroom</title>
  <meta name="description" content="See your postcard travel — Mailroom" />
  <!-- Smart App Banner — iOS Safari shows a 'Get the app' bar at the top. -->
  <meta name="apple-itunes-app" content="app-id=6768460855" />
  <link rel="icon" href="/favicon.png" />
  <!-- Apple MapKit JS. Loads asynchronously; calls window.initMapKit() when
       ready. If the script never loads (network, ad-block) the page falls
       back to the inline SVG map renderer below. -->
  <script crossorigin async
    src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js"
    data-callback="initMapKit"
    data-libraries="map,annotations,services,geojson"></script>
  <style>
    :root {
      --ink: #11141c;
      --muted-ink: #696969;
      --postal-red: #b8483a;
      --postal-blue: #3c6e8f;
      --gold: #d9b46e;
      --line: #d4c9b1;
      --paper: #F8F1E3;
      --paper-warm: #fdfaf1;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      color: var(--ink);
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 540px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .kicker {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.6px;
      color: var(--postal-red);
      text-transform: uppercase;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      font-weight: 600;
      color: var(--ink);
      margin: 6px 0 4px;
      line-height: 1.1;
      text-align: center;
    }
    .sub {
      font-size: 14px;
      color: var(--muted-ink);
      font-style: italic;
      margin: 0 0 20px;
      text-align: center;
    }
    /* Postcard preview — front */
    .postcard {
      width: 100%;
      aspect-ratio: 3 / 2;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 28px rgba(0,0,0,0.16);
      margin-bottom: 8px;
      transform: rotate(-1deg);
      transition: transform 0.3s ease;
    }
    .postcard:hover { transform: rotate(0deg); }
    .postcard img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .postcard.skeleton {
      background: linear-gradient(120deg, #eee 0%, #f4f4f4 50%, #eee 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    /* Stamp + postmark overlays */
    .stamp {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 54px;
      background: var(--postal-red);
      border: 2px dashed var(--paper-warm);
      box-shadow: 0 0 0 1px var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      font-family: ui-serif, Georgia, serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      transform: rotate(4deg);
      z-index: 2;
    }
    .postmark {
      position: absolute;
      top: 18px;
      right: 70px;
      width: 110px;
      height: 110px;
      border: 2px solid var(--postal-blue);
      border-radius: 50%;
      opacity: 0.55;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--postal-blue);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 1.2px;
      text-align: center;
      line-height: 1.3;
      text-transform: uppercase;
      transform: rotate(-6deg);
      pointer-events: none;
      z-index: 2;
    }
    .meta-line {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      color: var(--muted-ink);
      text-align: center;
      margin: 22px 0 8px;
      letter-spacing: 0.3px;
    }
    /* Map */
    .map-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .map-header-title {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--muted-ink);
      text-transform: uppercase;
    }
    .map-header-eta {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
    }
    .map-svg {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #eef4f5;
      border-radius: 6px;
      overflow: hidden;
    }
    /* Timeline */
    .timeline {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      margin: 16px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .timeline-header {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--muted-ink);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      font-size: 14px;
      color: var(--muted-ink);
    }
    .timeline-row.done {
      color: var(--ink);
    }
    .timeline-row.current {
      color: var(--postal-red);
      font-weight: 600;
    }
    .timeline-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--line);
      flex-shrink: 0;
      border: 2px solid var(--line);
    }
    .timeline-row.done .timeline-dot {
      background: var(--postal-red);
      border-color: var(--postal-red);
    }
    .timeline-row.current .timeline-dot {
      background: var(--postal-red);
      border-color: var(--postal-red);
      box-shadow: 0 0 0 4px rgba(184,72,58,0.15);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(184,72,58,0.15); }
      50% { box-shadow: 0 0 0 6px rgba(184,72,58,0.25); }
    }
    /* CTAs */
    .cta-row { display: flex; gap: 10px; margin-top: 18px; }
    .cta {
      flex: 1;
      padding: 14px 16px;
      border-radius: 10px;
      font-family: ui-serif, Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .cta-primary {
      background: var(--ink);
      color: var(--paper);
      border: 1px solid var(--ink);
    }
    .cta-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .cta:active { opacity: 0.85; }
    .footer {
      margin-top: 32px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 11px;
      color: var(--muted-ink);
      text-align: center;
    }
    .footer a { color: var(--muted-ink); }
    .state-card {
      background: var(--white);
      border-radius: 12px;
      padding: 30px 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      margin-top: 40px;
    }
    .state-card h2 {
      font-size: 22px;
      font-weight: 600;
      margin: 8px 0 6px;
    }
    .state-card p {
      font-size: 14px;
      color: var(--muted-ink);
      font-style: italic;
      margin: 0;
    }
  </style>
</head>
<body>
  <main id="root">
    <div class="kicker">Loading…</div>
    <h1>One sec.</h1>
    <p class="sub">Finding your postcard.</p>
    <div class="postcard skeleton"></div>
  </main>

  <script>
    /**
     * Confirmation page — /c/<draft_token>
     *
     * Loads via vercel rewrite: any /c/<token> path renders this page.
     * Fetches postcard data via supabase Edge Function. Realtime channel
     * watches the `postcards` row for status changes (PRINTING → MAILED
     * → IN TRANSIT → DELIVERED) and re-renders the timeline + map without
     * a full page refresh.
     */
    const SUPABASE_URL = "https://nlwnmgwylmmnaemdnzlq.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sd25tZ3d5bG1tbmFlbWRuemxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MDI1NjksImV4cCI6MjA5NDA3ODU2OX0.rZlWORqFLfFCBQQ4RPUOBtrqAX_Tc0Gf_sI5hPPENxM";

    // Token endpoint that signs MapKit JWTs server-side. The browser
    // never sees the .p8 private key.
    const MAPKIT_TOKEN_URL = `${SUPABASE_URL}/functions/v1/mapkit-token`;

    // City → approximate lat/lng. Mirrors a subset of the iOS app's
    // CITY_COORDS table for instant rendering without an extra geocode
    // round-trip. If a city isn't here, we fall back to MapKit's
    // Geocoder service (slower but covers everything).
    const CITY_COORDS = {
      "bethesda,MD": [38.98, -77.10],
      "san francisco,CA": [37.77, -122.42],
      "new york,NY": [40.71, -74.00],
      "brooklyn,NY": [40.65, -73.95],
      "los angeles,CA": [34.05, -118.24],
      "san diego,CA": [32.72, -117.16],
      "san jose,CA": [37.34, -121.89],
      "oakland,CA": [37.80, -122.27],
      "chicago,IL": [41.88, -87.63],
      "naples,FL": [26.14, -81.79],
      "miami,FL": [25.76, -80.19],
      "orlando,FL": [28.54, -81.38],
      "tampa,FL": [27.95, -82.46],
      "boston,MA": [42.36, -71.06],
      "seattle,WA": [47.61, -122.33],
      "denver,CO": [39.74, -104.99],
      "austin,TX": [30.27, -97.74],
      "houston,TX": [29.76, -95.37],
      "dallas,TX": [32.78, -96.80],
      "portland,OR": [45.52, -122.68],
      "atlanta,GA": [33.75, -84.39],
      "washington,DC": [38.91, -77.04],
      "philadelphia,PA": [39.95, -75.17],
      "pittsburgh,PA": [40.44, -79.99],
      "phoenix,AZ": [33.45, -112.07],
      "minneapolis,MN": [44.98, -93.27],
      "nashville,TN": [36.16, -86.78],
      "new orleans,LA": [29.95, -90.07],
      "salt lake city,UT": [40.76, -111.89],
      "las vegas,NV": [36.17, -115.14],
      "honolulu,HI": [21.31, -157.86],
      "anchorage,AK": [61.22, -149.90],
      "detroit,MI": [42.33, -83.05],
      "cleveland,OH": [41.50, -81.69],
      "raleigh,NC": [35.78, -78.64],
      "charlotte,NC": [35.23, -80.84],
      "charleston,SC": [32.78, -79.93],
      "savannah,GA": [32.08, -81.10],
      "kansas city,MO": [39.10, -94.58],
      "saint louis,MO": [38.63, -90.20],
      "st louis,MO": [38.63, -90.20],
      "milwaukee,WI": [43.04, -87.91],
      "madison,WI": [43.07, -89.40],
      "indianapolis,IN": [39.77, -86.16],
      "louisville,KY": [38.25, -85.76],
      "richmond,VA": [37.54, -77.44],
      "virginia beach,VA": [36.85, -75.98],
      "albuquerque,NM": [35.08, -106.65],
      "tucson,AZ": [32.22, -110.93],
      "sacramento,CA": [38.58, -121.49],
      "fresno,CA": [36.74, -119.79],
      "santa fe,NM": [35.69, -105.94],
      "boise,ID": [43.62, -116.20],
      "memphis,TN": [35.15, -90.05],
      "asheville,NC": [35.60, -82.55],
      "burlington,VT": [44.48, -73.21],
      "portland,ME": [43.66, -70.26],
      "providence,RI": [41.82, -71.42],
      "hartford,CT": [41.76, -72.69],
      "buffalo,NY": [42.89, -78.88],
      "rochester,NY": [43.16, -77.61],
      "albany,NY": [42.65, -73.76],
      "des moines,IA": [41.59, -93.62],
      "omaha,NE": [41.26, -95.93],
      "tulsa,OK": [36.15, -95.99],
      "oklahoma city,OK": [35.47, -97.52],
      "lexington,KY": [38.04, -84.50],
      "spokane,WA": [47.66, -117.43],
      "tacoma,WA": [47.25, -122.44],
      "eugene,OR": [44.05, -123.09],
      "santa monica,CA": [34.02, -118.49],
      "berkeley,CA": [37.87, -122.27],
      "palo alto,CA": [37.44, -122.14],
      "marin,CA": [38.00, -122.55],
    };

    // Continental US bounding box for SVG projection.
    const US_BBOX = { minLat: 24, maxLat: 50, minLng: -125, maxLng: -66 };

    function projectToSvg(lat, lng, viewW = 600, viewH = 375) {
      const x = ((lng - US_BBOX.minLng) / (US_BBOX.maxLng - US_BBOX.minLng)) * viewW;
      const y = viewH - ((lat - US_BBOX.minLat) / (US_BBOX.maxLat - US_BBOX.minLat)) * viewH;
      return [x, y];
    }

    function lookupCoord(city, state) {
      if (!city || !state) return null;
      const key = `${city.toLowerCase()},${state.toUpperCase()}`;
      return CITY_COORDS[key] ?? null;
    }

    function timelineLabel(event) {
      return {
        queued: "Queued",
        received: "Lob accepted",
        in_production: "Printing",
        mailed: "Mailed",
        in_transit: "In transit",
        processed_for_delivery: "At their post office",
        delivered: "Delivered ✓",
      }[event] ?? event;
    }

    function extractToken() {
      const segments = window.location.pathname.split("/").filter(Boolean);
      return segments[1] ?? "";
    }

    async function fetchConfirmation(token) {
      const url = `${SUPABASE_URL}/functions/v1/postcard-confirmation?token=${encodeURIComponent(token)}`;
      try {
        const res = await fetch(url, { headers: { apikey: SUPABASE_ANON } });
        return await res.json();
      } catch {
        return { ok: false, reason: "network" };
      }
    }

    function fmtDate(iso) {
      if (!iso) return "soon";
      try {
        return new Date(iso).toLocaleDateString("en-US", {
          weekday: "short", month: "short", day: "numeric",
        });
      } catch { return "soon"; }
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // =================================================================
     // Map rendering — Apple MapKit JS primary, SVG fallback.
    // =================================================================
    //
    // We try MapKit first because it matches the iOS app aesthetic (same
    // muted standard tiles, real geography, proper projection). If mapkit
    // hasn't loaded yet (slow network, blocked by extension, or the
    // mapkit-token endpoint 503s because credentials aren't set) we drop
    // back to the hand-drawn SVG below.

    let _mapkitReady = false;       // flipped true after mapkit.init resolves
    let _mapkitInstance = null;      // the live mapkit.Map for the active page
    const MK_PENDING = [];           // queue of [senderCoord, recipientCoord, container] before mapkit loads

    window.initMapKit = function () {
      if (typeof mapkit === "undefined") return;
      mapkit.init({
        authorizationCallback: function (done) {
          fetch(MAPKIT_TOKEN_URL)
            .then((r) => {
              if (!r.ok) throw new Error(`token endpoint ${r.status}`);
              return r.text();
            })
            .then((t) => done(t.trim()))
            .catch((e) => {
              console.warn("[mapkit] token fetch failed, falling back:", e);
              // Trigger SVG fallback for any pending maps
              _mapkitReady = false;
              MK_PENDING.forEach(([s, r, el]) => {
                if (el) el.innerHTML = renderMapSvg(s, r);
              });
              MK_PENDING.length = 0;
            });
        },
        language: "en",
      });
      _mapkitReady = true;
      // Drain queue — any maps that wanted to render before mapkit was ready
      MK_PENDING.forEach(([s, r, el]) => {
        if (el) renderMapKit(el, s, r);
      });
      MK_PENDING.length = 0;
    };

    // Returns the HTML string for the map slot. The slot is a div with a
    // sentinel data-attribute that hookMaps() will find post-render and
    // either bind a mapkit.Map to, or fill with the SVG fallback.
    function renderMap(senderCoord, recipientCoord) {
      const payload = JSON.stringify({
        sender: senderCoord, recipient: recipientCoord,
      });
      return `<div class="map-slot" data-coords='${escapeHtml(payload)}'>
                <!-- map renders here once DOM is in place -->
              </div>`;
    }

    // Called by render() after innerHTML is set. Finds every .map-slot,
    // either binds a mapkit.Map or falls back to SVG.
    function hookMaps() {
      const slots = document.querySelectorAll(".map-slot");
      slots.forEach((el) => {
        if (el.dataset.bound === "true") return; // already initialized
        el.dataset.bound = "true";
        let coords;
        try { coords = JSON.parse(el.dataset.coords || "{}"); } catch { coords = {}; }
        const s = coords.sender, r = coords.recipient;
        if (_mapkitReady && typeof mapkit !== "undefined") {
          renderMapKit(el, s, r);
        } else if (typeof mapkit !== "undefined" && !_mapkitReady) {
          // mapkit.js loaded but init hasn't run yet — queue.
          MK_PENDING.push([s, r, el]);
        } else {
          // No mapkit at all — SVG fallback.
          el.innerHTML = renderMapSvg(s, r);
        }
      });
    }

    function renderMapKit(container, senderCoord, recipientCoord) {
      // Clean any old map instance (Realtime polls re-render; we want one map).
      if (container._mkMap) {
        try { container._mkMap.destroy(); } catch {}
        container._mkMap = null;
      }
      container.innerHTML = "";
      container.style.cssText = "width:100%; height:260px; border-radius:8px; overflow:hidden;";

      const map = new mapkit.Map(container, {
        mapType: mapkit.Map.MapTypes.MutedStandard,
        colorScheme: mapkit.Map.ColorSchemes.Light,
        showsCompass: mapkit.FeatureVisibility.Hidden,
        showsScale: mapkit.FeatureVisibility.Hidden,
        showsZoomControl: false,
        showsMapTypeControl: false,
        showsPointsOfInterest: false,
        isRotationEnabled: false,
        showsUserLocationControl: false,
      });
      container._mkMap = map;

      const annotations = [];
      const coords = [];

      if (senderCoord) {
        const sCoord = new mapkit.Coordinate(senderCoord[0], senderCoord[1]);
        coords.push(sCoord);
        const sender = new mapkit.Annotation(sCoord, () => makePin("sender"), {
          title: "From",
          anchorOffset: new DOMPoint(0, -18),
          collisionMode: mapkit.Annotation.CollisionMode.None,
        });
        annotations.push(sender);
      }
      if (recipientCoord) {
        const rCoord = new mapkit.Coordinate(recipientCoord[0], recipientCoord[1]);
        coords.push(rCoord);
        const recipient = new mapkit.Annotation(rCoord, () => makePin("recipient"), {
          title: "To",
          anchorOffset: new DOMPoint(0, -18),
          collisionMode: mapkit.Annotation.CollisionMode.None,
        });
        annotations.push(recipient);
      }
      if (annotations.length) map.addAnnotations(annotations);

      // Route polyline
      if (senderCoord && recipientCoord) {
        const route = new mapkit.PolylineOverlay(coords, {
          style: new mapkit.Style({
            strokeColor: "#b8483a",
            lineWidth: 2.5,
            lineDash: [6, 5],
            lineCap: "round",
          }),
        });
        map.addOverlay(route);
      }

      // Auto-fit. Region.padding accepts insets so pins aren't flush to edges.
      if (coords.length >= 2) {
        const region = boundingRegion(coords);
        map.region = region;
      } else if (coords.length === 1) {
        map.region = new mapkit.CoordinateRegion(
          coords[0],
          new mapkit.CoordinateSpan(2.5, 2.5),
        );
      }
    }

    // Custom pin factory. Matches the iOS MapPanel pushpin: red disc for
    // sender, blue disc for recipient, with a subtle drop-shadow tail.
    // SVG returned inline so we can swap colors per pin role.
    function makePin(role) {
      const isSender = role === "sender";
      const fill = isSender ? "#b8483a" : "#3c6e8f";
      const glyph = isSender ? "★" : "✉";
      const el = document.createElement("div");
      el.style.cssText = "position:relative; width:32px; height:40px; pointer-events:auto;";
      el.innerHTML = `
        <svg viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.35));">
          <!-- shadow underneath the pin -->
          <ellipse cx="16" cy="38" rx="6" ry="1.5" fill="rgba(0,0,0,0.18)" />
          <!-- pin needle -->
          <path d="M16 38 L13 22 Q16 18 19 22 Z" fill="${fill}" opacity="0.85"/>
          <!-- pin head -->
          <circle cx="16" cy="14" r="11" fill="${fill}" stroke="#fdfaf1" stroke-width="2"/>
          <!-- glyph -->
          <text x="16" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#fdfaf1" font-family="ui-sans-serif,system-ui,sans-serif">${glyph}</text>
        </svg>
      `;
      return el;
    }

    // Pad a coordinate pair into a region that fits both with ~20% margin.
    function boundingRegion(coords) {
      let minLat = Infinity, maxLat = -Infinity;
      let minLng = Infinity, maxLng = -Infinity;
      coords.forEach((c) => {
        if (c.latitude < minLat) minLat = c.latitude;
        if (c.latitude > maxLat) maxLat = c.latitude;
        if (c.longitude < minLng) minLng = c.longitude;
        if (c.longitude > maxLng) maxLng = c.longitude;
      });
      const cLat = (minLat + maxLat) / 2;
      const cLng = (minLng + maxLng) / 2;
      const spanLat = Math.max((maxLat - minLat) * 1.4, 1);
      const spanLng = Math.max((maxLng - minLng) * 1.4, 1);
      return new mapkit.CoordinateRegion(
        new mapkit.Coordinate(cLat, cLng),
        new mapkit.CoordinateSpan(spanLat, spanLng),
      );
    }

    // SVG fallback — kept identical to the previous renderMap so the page
    // still works without MapKit (offline, key not configured, blocked).
    function renderMapSvg(senderCoord, recipientCoord) {
      const W = 600, H = 375;
      const usOutline = `
        <path d="M50,200 Q100,150 200,150 T400,150 Q500,150 550,180 L560,250 Q500,280 400,280 T200,280 Q100,280 50,250 Z"
              fill="#dde7e8" stroke="#aec4c6" stroke-width="1" />`;
      let dashedLine = "";
      let senderPin = "";
      let recipientPin = "";
      if (senderCoord) {
        const [sx, sy] = projectToSvg(senderCoord[0], senderCoord[1], W, H);
        senderPin = `<circle cx="${sx}" cy="${sy}" r="6" fill="#3c6e8f" />
                     <circle cx="${sx}" cy="${sy}" r="10" fill="none" stroke="#3c6e8f" stroke-width="1.5" opacity="0.4" />`;
      }
      if (recipientCoord) {
        const [rx, ry] = projectToSvg(recipientCoord[0], recipientCoord[1], W, H);
        recipientPin = `<circle cx="${rx}" cy="${ry}" r="6" fill="#b8483a" />
                        <circle cx="${rx}" cy="${ry}" r="10" fill="none" stroke="#b8483a" stroke-width="1.5" opacity="0.4" />`;
      }
      if (senderCoord && recipientCoord) {
        const [sx, sy] = projectToSvg(senderCoord[0], senderCoord[1], W, H);
        const [rx, ry] = projectToSvg(recipientCoord[0], recipientCoord[1], W, H);
        const mx = (sx + rx) / 2;
        const my = (sy + ry) / 2 - Math.abs(rx - sx) * 0.18;
        dashedLine = `<path d="M ${sx} ${sy} Q ${mx} ${my} ${rx} ${ry}"
                            fill="none" stroke="#b8483a" stroke-width="2"
                            stroke-dasharray="6 5" />`;
      }
      return `
        <svg class="map-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;border-radius:8px;">
          <rect x="0" y="0" width="${W}" height="${H}" fill="#eef4f5" />
          ${usOutline}
          ${dashedLine}
          ${senderPin}
          ${recipientPin}
        </svg>
      `;
    }

    function render(data) {
      const root = document.getElementById("root");
      const recipient = data.recipient || {};
      const sender = data.sender || {};
      const senderCoord = lookupCoord(sender.city, sender.state);
      const recipientCoord = lookupCoord(recipient.city, recipient.state);

      const eta = fmtDate(data.expected_delivery);
      const recipientLabel = `${recipient.city || "?"}, ${recipient.state || ""}`.trim();
      const senderLabel = sender.city ? `${sender.city}, ${sender.state || ""}` : "you";

      // v1.2 scheduled sending — when status === 'scheduled' the cron job
      // hasn't fired yet, so there's no Lob lifecycle to render. Show a
      // "mailing on X, arrives around Y" card in place of the live map.
      const isScheduled = data.status === "scheduled" && data.scheduled_send_at;
      const sendDateFmt = isScheduled ? fmtDate(data.scheduled_send_at) : "";
      // Arrival ≈ send + 7 days (Lob avg first-class transit). doSchedule
      // computes send = arrival - 7d so this is just the inverse.
      const arrivalDateFmt = isScheduled
        ? fmtDate(new Date(new Date(data.scheduled_send_at).getTime() + 7 * 24 * 60 * 60 * 1000).toISOString())
        : "";

      const kicker = isScheduled ? "SCHEDULED" : "YOUR POSTCARD";
      const h1 = isScheduled ? "Mailing soon." : "It's in the mail.";
      const sub = isScheduled
        ? `To ${escapeHtml(recipient.name || "your friend")} in ${escapeHtml(recipientLabel)}`
        : `To ${escapeHtml(recipient.name || "your friend")} in ${escapeHtml(recipientLabel)}`;

      const inFlightCard = isScheduled
        ? `
          <div class="map-card">
            <div class="map-header">
              <div class="map-header-title">Mailing ${escapeHtml(sendDateFmt)}</div>
              <div class="map-header-eta">Arrives ~${escapeHtml(arrivalDateFmt)}</div>
            </div>
            ${renderMap(senderCoord, recipientCoord)}
            <div style="padding: 12px 16px 4px; text-align: center; color: var(--muted-ink); font-style: italic; font-size: 13px;">
              We'll drop this in the mail on ${escapeHtml(sendDateFmt)}. Come back to watch it travel.
            </div>
          </div>`
        : `
          <div class="map-card">
            <div class="map-header">
              <div class="map-header-title">In flight</div>
              <div class="map-header-eta">Arrives ${eta}</div>
            </div>
            ${renderMap(senderCoord, recipientCoord)}
          </div>`;

      const timelineSection = isScheduled
        ? `
          <div class="timeline">
            <div class="timeline-header">Status</div>
            <div class="timeline-row current">
              <div class="timeline-dot"></div>
              <div>Scheduled — mailing ${escapeHtml(sendDateFmt)}</div>
            </div>
          </div>`
        : `
          <div class="timeline">
            <div class="timeline-header">Status</div>
            ${(data.timeline || []).map(row => `
              <div class="timeline-row ${row.done ? "done" : ""} ${row.current ? "current" : ""}">
                <div class="timeline-dot"></div>
                <div>${timelineLabel(row.event)}</div>
              </div>
            `).join("")}
          </div>`;

      // Postmark on a scheduled card shouldn't show today's date — pre-date
      // it to the planned mail day instead.
      const postmarkDate = isScheduled
        ? new Date(data.scheduled_send_at).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })
        : new Date(data.sent_at || Date.now()).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

      root.innerHTML = `
        <div class="kicker">${kicker}</div>
        <h1>${h1}</h1>
        <p class="sub">${sub}</p>

        <div class="postcard" id="postcard">
          ${data.photo_url ? `<img src="${escapeHtml(data.photo_url)}" alt="Your postcard photo" />` : ""}
          <div class="postmark">${escapeHtml((sender.city || "MAILROOM").toUpperCase())} • ${escapeHtml(postmarkDate)}</div>
          <div class="stamp">$0.55</div>
        </div>
        <div class="meta-line">${escapeHtml(senderLabel)} → ${escapeHtml(recipientLabel)}</div>

        ${inFlightCard}

        ${timelineSection}

        <div class="cta-row">
          <a href="sms:+14156836457&body=" class="cta cta-primary">Send another</a>
          <a href="https://apps.apple.com/us/app/mailroom-send-postcards/id6768460855" class="cta cta-secondary">Get the app</a>
        </div>

        <div class="footer">
          <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="mailto:hello@mailroomclub.io">Contact</a>
        </div>
      `;
    }

    function showState(opts) {
      const root = document.getElementById("root");
      root.innerHTML = `
        <div class="state-card">
          <div class="kicker">${opts.kicker ?? ""}</div>
          <h2>${opts.title ?? ""}</h2>
          <p>${opts.body ?? ""}</p>
        </div>
      `;
    }

    (async function init() {
      const token = extractToken();
      if (!token || token.length < 16) {
        showState({ kicker: "LINK PROBLEM", title: "Couldn't read your link.", body: "Tap the link from your SMS." });
        return;
      }
      const data = await fetchConfirmation(token);
      if (!data?.ok) {
        const map = {
          not_found: "We don't recognize this link.",
          not_sent_yet: "Your card hasn't been mailed yet. Hold tight.",
          postcard_missing: "Card not found. Text us another photo to start over.",
        };
        showState({
          kicker: "HMMM",
          title: map[data?.reason] || "Couldn't load your card.",
          body: "Try refreshing, or text us if it persists.",
        });
        return;
      }
      render(data);
      hookMaps();

      // Realtime: poll the same endpoint every 30s so status updates as
      // Lob webhooks fire. Cheaper than a full Realtime channel for a
      // one-off page. We could upgrade to WebSocket later.
      setInterval(async () => {
        const fresh = await fetchConfirmation(token);
        if (fresh?.ok) {
          render(fresh);
          hookMaps();
        }
      }, 30000);
    })();
  </script>
</body>
</html>
